<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="260" height="220">
  <defs>
    <linearGradient id="cyanSailStacked" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purpleLobeStacked" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#86198f" />
    </linearGradient>
  </defs>

  <!-- Centered Stylized "B" Monogram -->
  <g transform="translate(100, 10) scale(1.4)">
    <!-- Cyan Left Sail / Wave Stem -->
    <path d="M 28 4 C 20 18, 16 34, 18 52 C 19 59, 21 64, 25 66 C 26 62, 27 50, 29 38 C 30 26, 31 14, 28 4 Z" fill="url(#cyanSailStacked)" />
    
    <!-- Purple Top Wing / Lobe -->
    <path d="M 30 10 C 38 4, 48 8, 48 18 C 48 27, 39 31, 29 32 C 34 27, 37 21, 36 15 C 35 12, 33 11, 30 10 Z" fill="url(#purpleLobeStacked)" />
    
    <!-- Purple Bottom Wing / Lobe -->
    <path d="M 28 34 C 42 33, 52 40, 50 52 C 48 62, 36 65, 26 63 C 33 58, 38 52, 38 45 C 38 39, 34 36, 28 34 Z" fill="url(#purpleLobeStacked)" />
    
    <!-- Cyan Lower Accent Wave Swoosh -->
    <path d="M 20 63 C 28 66, 36 68, 46 60 C 44 63, 34 70, 22 66 Z" fill="url(#cyanSailStacked)" />
  </g>

  <!-- "Blue Sky" text centered below monogram -->
  <text x="130" y="160" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="38" font-weight="800" fill="#0284c7" text-anchor="middle" letter-spacing="1">Blue Sky</text>

  <!-- Purple Ribbon Banner "INTERNATIONAL" -->
  <g transform="translate(30, 175)">
    <rect x="0" y="0" width="200" height="22" rx="4" fill="#86198f" />
    <text x="100" y="16" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">INTERNATIONAL</text>
  </g>
</svg>
